[build]
  publish = "."

# Old WordPress URLs land on the home page.
[[redirects]]
  from = "/home/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/team/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; base-uri 'self'; form-action 'none'"
